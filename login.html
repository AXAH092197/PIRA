<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PIRA | Sign in preview</title><style>:root{font-family:system-ui,sans-serif;color:#18344d;background:#edf3f8}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}.panel{width:min(100%,420px);background:white;padding:clamp(20px,5vw,34px);border-radius:20px;box-shadow:0 12px 40px #14304b18}h1{font-size:2rem;margin:0}h2{margin-bottom:8px}p{line-height:1.5;color:#52687a}label{display:block;font-weight:600;margin:16px 0 6px}input,button{font:inherit;min-height:46px;border-radius:10px}input{width:100%;padding:12px;border:1px solid #9baebc}button{padding:10px 15px;cursor:pointer;border:1px solid #245e90;background:#245e90;color:white}button.secondary{background:white;color:#245e90}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.note{background:#e8f1fa;border-radius:10px;padding:12px;font-size:.9rem}.error{color:#a02020}button:focus-visible,input:focus-visible{outline:3px solid #478bd0;outline-offset:2px}</style></head><body><main class="panel"><h1>PIRA</h1><p>Personal Inventory & Reminder Application</p><div class="note">Interactive sequence preview only. No credentials are verified or sent anywhere. Do not enter a real password or authenticator code.</div><section id="view" aria-live="polite"></section></main><script type="module">
const view=document.getElementById("view");let stage="login";let email="";const el=(tag,text)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x};function button(text,fn,secondary=false){const b=el("button",text);b.type="button";if(secondary)b.className="secondary";b.onclick=fn;return b}function field(label,type="text",placeholder=""){const l=el("label",label),i=el("input");i.type=type;i.placeholder=placeholder;i.autocomplete="off";view.append(l,i);return i}function actions(...buttons){const a=el("div");a.className="actions";buttons.forEach(b=>a.append(b));view.append(a)}function render(){view.replaceChildren();if(stage==="login"){view.append(el("h2","Sign in"),el("p","Enter sample values to explore the login sequence."));const e=field("Email","email","name@example.com");const p=field("Password","password","Preview only");actions(button("Continue",()=>{if(!e.value.trim()||!p.value)return;email=e.value.trim();p.value="";stage="mfa";render()}),button("Forgot password?",()=>{stage="recovery";render()},true),button("Create account",()=>{stage="register";render()},true))}else if(stage==="mfa"){view.append(el("h2","Two-factor verification"),el("p","A production app would verify an authenticator code on the server. This preview accepts any six digits and grants NO authenticated access."));const code=field("Six-digit preview code","text","000000");code.inputMode="numeric";code.maxLength=6;actions(button("Preview home",()=>{if(!/^\d{6}$/.test(code.value))return;stage="home";render()}),button("Back",()=>{stage="login";render()},true),button("Use recovery code",()=>{stage="recovery";render()},true))}else if(stage==="home"){view.append(el("h2","Home page preview"),el("p","Sequence demonstration complete for "+email+". You are not authenticated."),el("p","The production app will validate the server session and authorized workspace before showing personal or business inventory."));actions(button("Open sample inventory shell",()=>{location.href="./index.html"}),button("Return to sign in",()=>{stage="login";render()},true))}else if(stage==="register"){view.append(el("h2","Create account"),el("p","Registration requires email ownership verification, secure password enrollment, and first-time MFA setup. This flow is not yet connected."));actions(button("Back to sign in",()=>{stage="login";render()},true))}else{view.append(el("h2","Account recovery"),el("p","Production recovery will use single-use, expiring verification and MFA recovery protections. No recovery message is sent from this preview."));actions(button("Back to sign in",()=>{stage="login";render()},true))}}render();
</script></body></html>
