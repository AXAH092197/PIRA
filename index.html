<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#173653"><title>PIRA | Development Preview</title><link rel="stylesheet" href="./src/client/security/security-settings.css">
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#172b3e;background:#f2f5f8;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #317cb6;outline-offset:2px}.app{min-height:100dvh;max-width:1250px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr)}aside{background:#173653;color:white;padding:24px 14px}aside h1{padding:0 12px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:inherit;text-align:left;padding:13px 14px;border-radius:12px;min-height:44px}.nav button[aria-current=page]{background:#335a7b;font-weight:700}main{min-width:0;padding:clamp(14px,3vw,36px);padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.top select{padding:10px;border:1px solid #a5b7c5;border-radius:10px;background:white;max-width:100%}.muted{color:#5a6c7c}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}.card{background:white;border:1px solid #d9e3ec;border-radius:15px;padding:18px;min-width:0;overflow-wrap:anywhere}.card h3{margin-top:0}.metric{font-size:2rem;font-weight:750}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:12px}.action{background:#245e90;color:white;border:0;border-radius:10px;padding:11px 15px;min-height:44px}.secondary{background:white;color:#173653;border:1px solid #b7c9d8}.field{padding:12px;border:1px solid #a5b7c5;border-radius:10px;min-height:44px;min-width:0;width:100%}.inventory{display:grid;gap:10px}.pill{background:#fcebcf;color:#704c00;border-radius:30px;padding:4px 9px;font-size:.8rem}.ok{background:#e0f2e8;color:#145536}.bottom{display:none}.notice{padding:12px;background:#e7f0f9;border-radius:10px}.hidden{display:none!important}#content{margin-top:22px}.detail{max-width:650px}.qty{font-size:1.7rem;font-weight:bold}.report{position:fixed;right:18px;bottom:18px;max-width:min(380px,calc(100vw - 36px));width:100%;background:white;border:1px solid #a5b7c5;border-radius:16px;box-shadow:0 10px 35px #17365333;padding:15px;z-index:5}.bars{display:flex;align-items:end;gap:10px;height:120px}.bars div{flex:1;background:#3c83b4;min-height:3px;border-radius:5px 5px 0 0}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #dde6ee;text-align:left}@media(max-width:700px){.app{display:block}aside{display:none}main{padding:16px max(12px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}.bottom{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom,0px);background:#fff;border-top:1px solid #d9e3ec;z-index:4}.bottom button{min-width:0;border:0;background:transparent;min-height:60px;font-size:clamp(.65rem,2.4vw,.85rem);padding:8px 2px;color:#274c68}.bottom button[aria-current=page]{background:#e5f0f8;font-weight:700}.report{bottom:calc(74px + env(safe-area-inset-bottom,0px));right:10px;max-width:calc(100vw - 20px)}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:14px}}@media(max-width:330px){.cards{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head><body><div class="app"><aside><h1>PIRA</h1><nav class="nav" id="desktop-nav" aria-label="Primary"></nav></aside><main><header class="top"><div><strong style="font-size:1.5rem">PIRA</strong><div class="muted">Development preview · sample data</div></div><label>Workspace <select id="workspace"><option>Personal</option><option>Business</option></select></label></header><div id="content" aria-live="polite"></div></main></div><nav class="bottom" id="mobile-nav" aria-label="Mobile primary"></nav><div id="report" class="report hidden" aria-label="Sample sales report"></div>
<script type="module">
import {mountSecuritySettings} from "./src/client/security/security-settings.js";
const pages=["Home","Items","Business","Copilot","Settings"];const labels={Home:"⌂ Home",Items:"▦ Items",Business:"▥ Business",Copilot:"✦ Copilot",Settings:"⚙ Settings"};
const seed=[{id:1,name:"Printer paper",category:"Office",qty:2,min:5,location:"Supply cabinet"},{id:2,name:"AA batteries",category:"Electronics",qty:8,min:6,location:"Storage drawer"},{id:3,name:"Cleaning wipes",category:"Cleaning",qty:3,min:8,location:"Utility closet"},{id:4,name:"Shipping boxes",category:"Packaging",qty:14,min:10,location:"Stockroom"}];
let page="Home",selected=null,workspace="Personal",items=seed.map(x=>({...x})),reportOpen=false,reportMin=false,cleanup=null;
const $=id=>document.getElementById(id),el=(tag,txt,cls)=>{const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n},btn=(text,fn,cls="action")=>{const n=el("button",text,cls);n.type="button";n.addEventListener("click",fn);return n},add=(p,...nodes)=>{nodes.forEach(n=>p.append(n));return p},card=(...nodes)=>add(el("section",undefined,"card stack"),...nodes),title=t=>el("h2",t),low=()=>items.filter(i=>i.qty<i.min),nav=p=>{page=p;selected=null;render()};
function drawNav(){for(const id of ["desktop-nav","mobile-nav"]){const root=$(id);root.replaceChildren();for(const p of pages){const b=btn(labels[p],()=>nav(p));b.setAttribute("aria-current",p===page?"page":"false");root.append(b)}}}
function render(){if(cleanup){cleanup();cleanup=null}drawNav();const root=$("content");root.replaceChildren();if(page==="Home"){add(root,title("Overview"),el("p","Manage your inventory without unnecessary menus.","muted"));const stats=el("div",undefined,"cards");add(stats,card(el("span","Item types","muted"),el("strong",String(items.length),"metric"),btn("Browse inventory",()=>nav("Items"))),card(el("span","Low stock","muted"),el("strong",String(low().length),"metric"),btn("Review items",()=>nav("Items"))));root.append(stats);root.append(title("Needs attention"));for(const i of low())root.append(card(el("strong",i.name),el("span",i.qty+" remaining · minimum "+i.min,"muted"),btn("Open item",()=>{page="Items";selected=i.id;render()},"action secondary")));root.append(btn("Add item",()=>{page="Items";selected="new";render()}))}
if(page==="Items"){if(selected==="new"){add(root,title("Add inventory item"));const form=el("form",undefined,"card stack");const name=el("input"),qty=el("input"),cat=el("input");name.className=qty.className=cat.className="field";name.placeholder="Item name";name.required=true;qty.type="number";qty.min="0";qty.value="1";cat.placeholder="Category";add(form,el("label","Item name"),name,el("label","Quantity"),qty,el("label","Category"),cat);form.append(btn("Save item",()=>{}));form.addEventListener("submit",e=>{e.preventDefault();items.push({id:Date.now(),name:name.value.trim(),category:cat.value.trim()||"Other",qty:Number(qty.value),min:3,location:"Unassigned"});selected=null;render()});root.append(form);root.append(btn("Back",()=>{selected=null;render()},"action secondary"))}else if(selected!==null){const i=items.find(x=>x.id===selected);if(i){add(root,title(i.name));const c=card(el("span",i.category+" · "+i.location,"muted"),el("span","Quantity: "+i.qty,"qty"));const controls=el("div",undefined,"row");add(controls,btn("− Decrease",()=>{i.qty=Math.max(0,i.qty-1);render()},"action secondary"),btn("+ Increase",()=>{i.qty++;render()}));add(c,controls,el("span","Reorder minimum: "+i.min),btn("Back to inventory",()=>{selected=null;render()},"action secondary"));root.append(c)}}else{const header=el("div",undefined,"row between");add(header,title("Inventory"),btn("+ Add item",()=>{selected="new";render()}));root.append(header);const search=el("input");search.className="field";search.placeholder="Search items or categories";search.setAttribute("aria-label","Search inventory");const list=el("div",undefined,"inventory");const draw=()=>{list.replaceChildren();for(const i of items.filter(i=>(i.name+" "+i.category).toLowerCase().includes(search.value.toLowerCase()))){const r=card(el("strong",i.name),el("span",i.category+" · "+i.qty+" units","muted"),btn("View details",()=>{selected=i.id;render()},"action secondary"));if(i.qty<i.min)r.append(el("span","Low stock","pill"));list.append(r)}};search.addEventListener("input",draw);add(root,search,list);draw()}}}
if(page==="Business"){add(root,title("Business operations"),el("p","Illustrative records only; no live POS or supplier connection.","muted"));const tabs=el("div",undefined,"cards");add(tabs,card(title("Orders"),el("p","2 sample orders"),btn("View sample orders",()=>{const c=card(el("strong","ORD-1042 · Printer paper"),el("span","Awaiting delivery","muted"),el("strong","ORD-1041 · Shipping boxes"),el("span","Received","muted"));root.append(c)})),card(title("Reporting"),el("p","Sample sales trend"),btn("Open report",()=>{reportOpen=true;reportMin=false;drawReport()})),card(title("Imports"),el("p","CSV, POS, paper logs: planned"),el("span","Import processing is not connected.","muted")));root.append(tabs)}
if(page==="Copilot"){add(root,title("PIRA Copilot"),el("p","Typed assistance demo; no external AI service connected.","muted"));const history=el("div",undefined,"stack");const form=el("form",undefined,"card stack");const inp=el("input");inp.className="field";inp.placeholder="Ask about low stock, quantities, or sales";inp.required=true;add(form,inp,btn("Send",()=>{}));form.addEventListener("submit",e=>{e.preventDefault();const q=inp.value.toLowerCase();let answer="This preview supports low-stock, quantities, and sample sales requests.";if(q.includes("low")||q.includes("reorder"))answer=low().map(i=>i.name+" ("+i.qty+")").join(", ")||"Nothing is below minimum.";else if(q.includes("how many")||q.includes("quantity"))answer=items.length+" item types, "+items.reduce((a,i)=>a+i.qty,0)+" units total.";else if(q.includes("sales")||q.includes("report")){answer="Opening a sample report. It remains available while navigating.";reportOpen=true;reportMin=false;drawReport()}history.append(card(el("strong","You"),el("span",inp.value)),card(el("strong","PIRA"),el("span",answer)));inp.value=""});add(root,history,form)}
if(page==="Settings"){add(root,title("Settings"));const holder=el("div",undefined,"card");root.append(holder);cleanup=mountSecuritySettings(holder,window);root.append(card(title("Workspace preferences"),el("p","Switch Personal and Business using the workspace selector above. Separate authenticated sessions require backend implementation.","muted")))}
}
function drawReport(){const r=$("report");r.classList.toggle("hidden",!reportOpen);r.replaceChildren();if(!reportOpen)return;const head=el("div",undefined,"row between");add(head,el("strong","Sample sales report"),btn(reportMin?"Expand":"Minimize",()=>{reportMin=!reportMin;drawReport()},"action secondary"),btn("Close",()=>{reportOpen=false;drawReport()},"action secondary"));r.append(head);if(reportMin)return;const chart=el("div",undefined,"bars");for(const n of [35,50,68,62,85,100]){const b=el("div");b.style.height=n+"%";b.title="Sample relative sales "+n+"%";chart.append(b)}add(r,el("p","Illustrative hourly trend; not live.","muted"),chart);const t=el("table");for(const [a,b] of [["Hour","Sales"],["9 AM","$320"],["10 AM","$480"],["11 AM","$710"],["12 PM","$650"]]){const tr=el("tr");add(tr,el("td",a),el("td",b));t.append(tr)}r.append(t)}
$("workspace").addEventListener("change",e=>{workspace=e.target.value;nav("Home")});render();
</script></body></html>
